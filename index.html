<style>
:root{
  --bg:#EEF2F0; --surface:#FFFFFF; --surface-2:#F6F8F7; --ink:#1B2A28; --ink-2:#4E5E5B; --line:#D5DDDA;
  --pine:#2E6A58; --pine-ink:#FFFFFF; --pine-soft:#DCEBE5;
  --amber:#9A6412; --amber-soft:#F7EAD2;
  --blue:#34558F; --blue-soft:#DFE6F3;
  --red:#A63A35; --red-soft:#F5DEDC;
  --grey-soft:#E6EAE9;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#121918; --surface:#1A2321; --surface-2:#202B29; --ink:#E4ECE9; --ink-2:#A2B2AE; --line:#30403C;
    --pine:#5FAE93; --pine-ink:#0E1A17; --pine-soft:#1F3A32;
    --amber:#E2AE5C; --amber-soft:#3A2E1A; --blue:#8DA8DA; --blue-soft:#232E44;
    --red:#E58A84; --red-soft:#3D2322; --grey-soft:#26302E;
  }
}
:root[data-theme="dark"]{
  --bg:#121918; --surface:#1A2321; --surface-2:#202B29; --ink:#E4ECE9; --ink-2:#A2B2AE; --line:#30403C;
  --pine:#5FAE93; --pine-ink:#0E1A17; --pine-soft:#1F3A32;
  --amber:#E2AE5C; --amber-soft:#3A2E1A; --blue:#8DA8DA; --blue-soft:#232E44;
  --red:#E58A84; --red-soft:#3D2322; --grey-soft:#26302E;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.55;font-weight:400;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--pine);outline-offset:2px}
h1,h2,h3{margin:0;line-height:1.2}
.wrap{max-width:1320px;margin:0 auto;padding:0 20px}

.bar{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.bar .wrap{display:flex;align-items:center;gap:16px;min-height:62px;flex-wrap:wrap;padding-top:8px;padding-bottom:8px}
.brand{font-weight:700;font-size:17px;letter-spacing:-.01em;line-height:1.25;display:flex;align-items:center;gap:10px}
.brand small{display:block;font-size:12px;font-weight:500;color:var(--ink-2);letter-spacing:0}
.brand-mark{width:30px;height:30px;border-radius:8px;background:var(--pine);color:var(--pine-ink);display:grid;place-items:center;font-size:15px}
.bar-right{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.bar-right label{font-size:13px;color:var(--ink-2)}
.bar-right select{width:auto;padding:7px 10px}

.btn{border:1px solid var(--line);background:var(--surface);padding:9px 16px;border-radius:10px;cursor:pointer;font-weight:600;font-size:14px;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn-primary{background:var(--pine);border-color:var(--pine);color:var(--pine-ink)}
.btn-primary:hover{background:var(--pine);filter:brightness(1.08)}
.btn-danger{color:var(--red);border-color:var(--red)}
.btn-danger:hover{background:var(--red-soft)}
.btn-sm{padding:6px 12px;font-size:13px}
.btn:disabled{opacity:.6;cursor:progress}
.link{background:none;border:0;color:var(--pine);font-weight:600;cursor:pointer;padding:0;font-size:inherit;font-family:inherit;text-align:left;line-height:1.35}
td .link{min-width:110px}
.link:hover{text-decoration:underline}

main{padding:24px 0 72px}
.banner{border-radius:10px;padding:11px 16px;font-size:14px;margin-bottom:18px;background:var(--blue-soft)}
.banner.warn{background:var(--amber-soft)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:22px;overflow-x:auto;overflow-y:hidden;align-items:flex-end;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.clock{margin-left:auto;padding:0 4px 10px 16px;text-align:right;white-space:nowrap;line-height:1.3;flex-shrink:0}
.clock b{display:block;font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink)}
.clock span{font-size:12.5px;color:var(--ink-2)}
@media (max-width:720px){.clock{display:none}}
.tab{background:none;border:0;padding:10px 14px;cursor:pointer;font-weight:600;font-size:14.5px;color:var(--ink-2);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--pine)}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.page-head h1{font-size:24px;font-weight:700;letter-spacing:-.015em;line-height:1.25}
.page-head p{margin:6px 0 0;color:var(--ink-2);max-width:68ch;font-size:14.5px}
.actions{display:flex;gap:8px;flex-wrap:wrap}

.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:24px}
.tile{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:2px}
button.tile{cursor:pointer}
button.tile:hover{background:var(--surface-2)}
.tile b{font-size:30px;font-weight:700;line-height:1.15;letter-spacing:-.02em;font-variant-numeric:tabular-nums;color:var(--c,var(--ink))}
.tile span{font-size:13px;color:var(--ink-2)}

.filters{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.filters input{max-width:280px}
.filters select{max-width:220px}

.list{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12.5px;color:var(--ink-2);font-weight:600;background:var(--surface-2);white-space:nowrap;letter-spacing:.01em}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
th.no,td.no{width:52px;text-align:center;color:var(--ink-2);font-variant-numeric:tabular-nums}
.th-sort{background:none;border:0;padding:0;font:inherit;color:inherit;cursor:pointer;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.th-sort:hover{color:var(--ink)}
.th-sort .arr{font-size:10px;opacity:.35}
.th-sort.on{color:var(--ink)}
.th-sort.on .arr{opacity:1;color:var(--pine)}
th.num .th-sort{width:100%;justify-content:flex-end}
tr.click{cursor:pointer}
td.act-cell{position:sticky;right:0;background:var(--surface);white-space:nowrap;box-shadow:-8px 0 8px -8px rgba(0,0,0,.12)}
tr:hover td.act-cell{background:var(--surface-2)}
td.note-cell{min-width:150px;max-width:280px;font-size:13.5px}
.list td .chip{white-space:normal;line-height:1.3}
.act-grid{display:grid;grid-template-columns:repeat(2,auto);gap:6px;justify-content:start}
.act-grid .btn{text-align:center}
.note-clamp{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;white-space:normal}
tr.click:hover td{background:var(--surface-2)}
td{line-height:1.45}
td .s{font-size:12.5px;color:var(--ink-2);margin-top:2px}
.sisa{font-weight:700;font-size:16px;font-variant-numeric:tabular-nums}
.sisa.low{color:var(--amber)} .sisa.out{color:var(--red)} .sisa.ok{color:var(--pine)}
.empty{padding:40px 20px;text-align:center;color:var(--ink-2)}
.empty .btn{margin-top:12px}

.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;white-space:nowrap}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.st-ok{background:var(--pine-soft);color:var(--pine)}
.st-wait{background:var(--amber-soft);color:var(--amber)}
.st-no{background:var(--red-soft);color:var(--red)}
.st-off{background:var(--grey-soft);color:var(--ink-2)}

.layout-input{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:20px;align-items:start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px 24px}
.panel h2{font-size:16.5px;font-weight:700;margin-bottom:16px;letter-spacing:-.005em}
.side{position:sticky;top:84px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px 18px}
.field{display:flex;flex-direction:column;gap:6px}
.field.full{grid-column:1/-1}
.field label{font-size:13px;font-weight:600;color:var(--ink)}
.field .hint{font-size:12px;color:var(--ink-2)}
input,select,textarea{font-size:14.5px;border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:10px 12px;width:100%}
textarea{resize:vertical;min-height:70px}
.check{display:flex;align-items:center;gap:8px;font-weight:500!important}
.check input{width:auto}
.form-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.err{color:var(--red);font-size:13px;margin-top:10px;min-height:1em}
.warn{background:var(--amber-soft);color:var(--ink);border-radius:10px;padding:10px 14px;font-size:13px;margin-top:12px}
.warn.bad{background:var(--red-soft)}

.bal-big{font-size:40px;font-weight:700;letter-spacing:-.025em;line-height:1.05;font-variant-numeric:tabular-nums}
.bal-big small{font-size:14.5px;font-weight:500;color:var(--ink-2);letter-spacing:0}
.kv{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:14px;margin-top:14px}
.kv dt{color:var(--ink-2)} .kv dd{margin:0;font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.kv .tot{border-top:1px solid var(--line);padding-top:8px}
.after{margin-top:14px;padding:12px 14px;border-radius:10px;background:var(--pine-soft);font-size:14px}
.after.bad{background:var(--red-soft)}
.meter{height:10px;border-radius:999px;background:var(--grey-soft);overflow:hidden;display:flex;margin-top:12px}
.meter i{display:block;height:100%}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);margin-top:8px}
.legend span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;background:var(--c)}
.mini-list{list-style:none;margin:14px 0 0;padding:0;font-size:13px}
.mini-list li{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-top:1px solid var(--line)}
.sub{font-size:13px;color:var(--ink-2);margin:0 0 12px}

dialog{border:0;border-radius:16px;padding:0;width:min(680px,calc(100% - 24px));max-height:calc(100% - 24px);background:var(--surface);color:var(--ink);box-shadow:0 24px 60px rgba(10,25,20,.28)}
dialog::backdrop{background:rgba(15,25,22,.45)}
.dlg-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:20px 24px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:1}
.dlg-head h2{font-size:18px;font-weight:700;letter-spacing:-.01em}
.dlg-head .s{font-size:13px;color:var(--ink-2);margin-top:4px}
.x{background:none;border:0;font-size:22px;cursor:pointer;color:var(--ink-2);line-height:1;padding:4px 8px;border-radius:8px}
.x:hover{background:var(--surface-2)}
.dlg-body{padding:20px 24px 24px}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:10px;font-size:14px;font-weight:600;z-index:50;max-width:calc(100% - 32px);opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.loading{padding:80px 20px;text-align:center;color:var(--ink-2)}
.role{font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--pine-soft);color:var(--pine);white-space:nowrap}
.role.user{background:var(--blue-soft);color:var(--blue)}
.who{font-size:13px;color:var(--ink-2)}
.acc-results{border:1px solid var(--line);border-radius:10px;margin-top:6px;overflow:hidden;background:var(--surface)}
.acc-results:empty{display:none}
.acc-results button{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:9px 12px;cursor:pointer}
.acc-results button:last-child{border-bottom:0}
.acc-results button:hover{background:var(--surface-2)}
.acc-linked{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:var(--pine-soft)}
.help{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 20px;margin-top:20px;font-size:14px}
.help h3{font-size:14px;margin-bottom:8px}
.help ol{margin:0;padding-left:20px}
.help li{margin:4px 0}
.danger-zone{border-color:var(--red);display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.danger-zone p{margin:4px 0 0}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:8px;cursor:pointer}
.opt input{width:auto;margin-top:3px}
.opt b{display:block;font-size:14px}
.opt span{font-size:13px;color:var(--ink-2)}
.opt:has(input:checked){border-color:var(--red);background:var(--red-soft)}
.opt.hol:has(input:checked){border-color:var(--pine);background:var(--pine-soft)}
.user-hero{display:grid;grid-template-columns:auto 1fr;gap:28px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px 26px;margin-bottom:22px}
@media (max-width:640px){.user-hero{grid-template-columns:1fr}}

.hol-form{grid-template-columns:200px 1fr auto;align-items:end}
@media (max-width:860px){
  .hol-form{grid-template-columns:1fr}
  .layout-input{grid-template-columns:1fr}
  .side{position:static}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:640px){
  .grid2{grid-template-columns:1fr}
  .brand small{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ---- login & tambahan versi Google Sheets ---- */
.login{min-height:100vh;display:grid;place-items:center;padding:40px 20px}
.login-box{width:100%;max-width:400px}
.login-box .brand{margin-bottom:28px}
.login-box h1{font-size:26px;font-weight:700;letter-spacing:-.015em}
.login-box .lead{color:var(--ink-2);margin:6px 0 20px;font-size:14.5px}
.login-box form{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:14px}
.login-box .foot{font-size:13px;color:var(--ink-2);margin-top:14px}
.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;cursor:pointer;font-weight:600;font-size:13px}
.settings{position:relative}
label .opt{font-weight:500;color:var(--ink-2)}
body.menu-open .alert-pop{visibility:hidden}
.settings .menu{position:absolute;right:0;top:calc(100% + 6px);z-index:95;min-width:220px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 30px rgba(10,25,20,.14);padding:6px;animation:dlgIn .18s cubic-bezier(.2,.7,.2,1)}
.settings .mi{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:9px 10px;font:inherit;font-size:13.5px;font-weight:600;color:var(--ink);cursor:pointer;text-decoration:none}
.settings .mi:hover{background:var(--surface-2)}
.settings .mi[aria-checked="true"]{color:var(--pine)}
.settings .mi[aria-checked="true"]::after{content:"✓";margin-left:auto;font-weight:800}
.settings .mi-sep{height:1px;background:var(--line);margin:6px 4px}
.settings .mi-label{font-size:11.5px;font-weight:700;color:var(--ink-2);padding:4px 10px 2px;text-transform:uppercase;letter-spacing:.05em}
.lang-switch{display:flex;gap:6px;justify-content:center;margin-top:10px}
.lang-switch button{background:none;border:1px solid var(--line);border-radius:999px;padding:5px 12px;font:inherit;font-size:12.5px;font-weight:600;color:var(--ink-2);cursor:pointer}
.lang-switch button[aria-pressed="true"]{background:var(--pine);border-color:var(--pine);color:var(--pine-ink)}
.icon-btn:hover{background:var(--surface-2)}
a.icon-btn{text-decoration:none;color:inherit;display:inline-block}
#cdlg{width:min(460px,calc(100% - 24px))}
.cf-msg{font-size:14.5px;color:var(--ink-2)}
.cf-msg p{margin:0 0 10px}
.cf-list{margin:0 0 10px;padding-left:20px;max-height:240px;overflow:auto;color:var(--ink)}
.cf-list li{margin:2px 0}
.btn-danger-solid{background:var(--red);border-color:var(--red);color:var(--pine-ink)}
.btn-danger-solid:hover{background:var(--red);filter:brightness(1.08)}
.busy-bar{position:fixed;top:0;left:0;right:0;height:3px;background:var(--pine);transform-origin:left;animation:busy 1.2s ease-in-out infinite;z-index:60}
@keyframes busy{0%{transform:scaleX(.05)}50%{transform:scaleX(.7)}100%{transform:scaleX(1);opacity:0}}
@media (prefers-reduced-motion:reduce){.busy-bar{animation:none}}
/* ---- Animasi perpindahan menu ---- */
.tab{transition:color .2s ease,background-color .2s ease;border-radius:8px 8px 0 0;position:relative}
.tab:hover{color:var(--ink);background:var(--surface-2)}
.tab[aria-selected="true"]{border-bottom-color:transparent}
.tab[aria-selected="true"]::after{content:"";position:absolute;left:10px;right:10px;bottom:-1px;height:2px;border-radius:2px;background:var(--pine);transform-origin:center}
.tab.tab-enter::after{animation:tabLine .32s cubic-bezier(.2,.7,.2,1)}
@keyframes tabLine{from{transform:scaleX(.2);opacity:.2}to{transform:scaleX(1);opacity:1}}
.view-enter{animation:viewIn .32s cubic-bezier(.2,.7,.2,1) both}
@keyframes viewIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.login-box{animation:viewIn .4s cubic-bezier(.2,.7,.2,1) both}
.form-enter{animation:formIn .3s cubic-bezier(.2,.7,.2,1) both;transform-origin:top center}
@keyframes formIn{from{opacity:0;transform:translateY(-6px) scale(.99)}to{opacity:1;transform:none}}
.view-enter .tile{animation:viewIn .36s cubic-bezier(.2,.7,.2,1) both}
.view-enter .tile:nth-child(2){animation-delay:.04s}.view-enter .tile:nth-child(3){animation-delay:.08s}.view-enter .tile:nth-child(4){animation-delay:.12s}
dialog[open]{animation:dlgIn .22s cubic-bezier(.2,.7,.2,1)}
dialog[open]::backdrop{animation:fadeIn .22s ease}
@keyframes dlgIn{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.btn,.icon-btn,.tile{transition:background-color .15s ease,border-color .15s ease,transform .15s ease,box-shadow .15s ease}
button.tile:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(10,25,20,.08)}
/* ---- Laporan ---- */
.rep-head{border-bottom:3px solid var(--pine);padding-bottom:8px;margin:0 0 14px}
.rep-head .t{font-size:18px;font-weight:700}
.rep-head .m{font-size:13px;color:var(--ink-2);margin-top:2px}
.rep-sec{font-size:15px;font-weight:700;margin:18px 0 8px}
tr.rep-total td{font-weight:700;background:var(--surface-2)}
@media print{
  @page{size:A4 landscape;margin:12mm}
  html,body{background:#fff!important;color:#000}
  .bar,.tabs,.no-print,.busy-bar,#alert-pop,.toast,.banner,.pv,.page-head .actions{display:none!important}
  main .wrap{max-width:none;padding:0}
  .list{border:0!important;box-shadow:none!important;overflow:visible!important}
  table{font-size:9.5pt}
  th,td{padding:4px 6px!important;border:1px solid #ccc!important}
  th{background:#2E6A58!important;color:#fff!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  tr.rep-total td{background:#EEF2F0!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  tr{break-inside:avoid}
  .view-enter{animation:none!important}
}
/* ---- Data karyawan per divisi ---- */
tr.grp-row td{background:var(--surface-2);padding:0;border-top:1px solid var(--line)}
.grp-btn{width:100%;display:flex;align-items:center;gap:10px;background:none;border:0;padding:11px 14px;font:inherit;cursor:pointer;text-align:left;color:var(--ink)}
.grp-btn:hover{background:var(--grey-soft)}
.grp-btn b{font-size:14.5px}
.grp-arrow{width:14px;color:var(--pine);font-size:13px}
.grp-meta{font-size:12.5px;color:var(--ink-2)}
/* ---- Pengingat pengajuan yang perlu ditindaklanjuti ---- */
.tab-badge{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;margin-left:6px;border-radius:999px;background:var(--red);color:var(--pine-ink);font-size:11.5px;font-weight:700;line-height:1;vertical-align:1px;animation:badgePop .35s cubic-bezier(.2,.7,.2,1)}
@keyframes badgePop{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}
.alert-pop{position:fixed;top:calc(78px + env(safe-area-inset-top,0px));right:16px;z-index:80;width:min(360px,calc(100% - 32px));background:var(--red);color:var(--pine-ink);border-radius:14px;box-shadow:0 12px 32px rgba(120,20,20,.35);padding:14px 16px 14px 16px;display:flex;gap:12px;align-items:flex-start;animation:alertIn .4s cubic-bezier(.2,.7,.2,1)}
.alert-pop .ico{flex:none;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.2);display:grid;place-items:center;font-size:18px;font-weight:800}
.alert-pop b{display:block;font-size:15px;margin-bottom:2px}
.alert-pop p{margin:0 0 10px;font-size:13px;opacity:.95}
.alert-pop .go{background:var(--pine-ink);color:var(--red);border:0;border-radius:8px;padding:7px 12px;font:inherit;font-weight:700;font-size:13px;cursor:pointer}
.alert-pop .cls{margin-left:auto;background:none;border:0;color:inherit;font-size:20px;line-height:1;cursor:pointer;opacity:.85;padding:0 2px}
@keyframes alertIn{from{opacity:0;transform:translateY(-12px) scale(.97)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.tab-badge,.alert-pop{animation:none}}
/* ---- Kalender hari libur 1 tahun ---- */
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:8px 14px;font:inherit;font-weight:600;font-size:13.5px;color:var(--ink-2);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--pine);color:var(--pine-ink)}
.cal-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:0 0 12px}
.cal-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2)}
.cal-legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.cal-year{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.cal-m{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 12px 10px}
.cal-m h3{font-size:14px;font-weight:700;margin:0 0 8px;display:flex;justify-content:space-between}
.cal-m h3 span{font-weight:600;font-size:12px;color:var(--red)}
.cal-g{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.cal-g .wd{font-size:11px;font-weight:700;color:var(--ink-2);padding:2px 0 4px}
.cal-g .wd.sun{color:var(--red)}
.cal-g .d{border:0;background:none;font:inherit;font-size:12.5px;line-height:1;padding:7px 0;border-radius:7px;color:var(--ink);cursor:default;font-variant-numeric:tabular-nums}
.cal-g .d.sun{color:var(--red)}
.cal-g .d.sat{color:var(--ink-2)}
.cal-g .d.hol{background:var(--red);color:var(--pine-ink);font-weight:700;cursor:pointer}
.cal-g .d.cb{background:var(--amber);color:var(--pine-ink);font-weight:700;cursor:pointer}
.cal-g .d.today{box-shadow:inset 0 0 0 2px var(--pine);font-weight:700}
.cal-g .d.pick{cursor:pointer}
.cal-g .d.pick:hover{background:var(--surface-2)}
.cal-list{margin:8px 0 0;padding:0;list-style:none;font-size:12px;color:var(--ink-2)}
.cal-list li{display:flex;gap:6px;padding:1px 0}
.cal-list b{color:var(--ink);min-width:18px;text-align:right;font-variant-numeric:tabular-nums}
/* ---- Tracking pengajuan ---- */
.chip-btn{background:none;border:0;padding:0;cursor:pointer;display:inline-flex;align-items:center;gap:4px;font:inherit;text-align:left}
.chip-btn .trk{font-size:12px;color:var(--ink-2);text-decoration:underline dotted;white-space:nowrap}
.chip-btn:hover .chip{filter:brightness(.96)}
.track{list-style:none;margin:6px 0 0;padding:0}
.track li{position:relative;padding:0 0 20px 40px;min-height:30px}
.track li::before{content:"";position:absolute;left:13px;top:28px;bottom:0;width:2px;background:var(--line)}
.track li:last-child{padding-bottom:0}
.track li:last-child::before{display:none}
.track li.done::before{background:var(--pine)}
.track .dot{position:absolute;left:0;top:0;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:14px;font-weight:700;border:2px solid var(--line);background:var(--surface);color:var(--ink-2);box-sizing:border-box}
.track li.done .dot{background:var(--pine);border-color:var(--pine);color:var(--pine-ink)}
.track li.current .dot{border-color:var(--amber);color:var(--amber);animation:trkPulse 1.6s ease-out infinite}
.track li.rejected .dot{background:var(--red);border-color:var(--red);color:var(--pine-ink)}
.track li.skipped{opacity:.45}
.track .t{font-weight:700;font-size:14.5px;line-height:1.3;padding-top:3px}
.track .w{font-size:13px;color:var(--ink-2);margin-top:2px}
.track .n{font-size:13px;margin-top:6px;padding:8px 10px;border-radius:8px;background:var(--surface-2)}
.trk-step{font-size:12.5px;font-weight:600;color:var(--ink-2)}
@keyframes trkPulse{0%{box-shadow:0 0 0 0 rgba(176,122,26,.4)}70%{box-shadow:0 0 0 9px rgba(176,122,26,0)}100%{box-shadow:0 0 0 0 rgba(176,122,26,0)}}
@media (prefers-reduced-motion:reduce){.track li.current .dot{animation:none}}
@media (prefers-reduced-motion:reduce){.login-box,.form-enter,.view-enter,.view-enter .tile,.tab.tab-enter::after,dialog[open],dialog[open]::backdrop{animation:none!important}button.tile:hover{transform:none}}
</style>

/* Jumlah hari kerja selalu dihitung dari tanggal; "setengah hari" hanya untuk cuti 1 hari */
function calcDays(o){var auto=workdays(o.start,o.end);if(o.half&&o.start&&o.start===o.end&&auto>=1)return 0.5;if(o.half&&o.start!==o.end)o.half=false;return auto}
function daysText(o){var n=calcDays(o);return n?fNum(n)+" hari":""}
/* Keterangan di bawah pilihan Setengah hari */
function halfHint(o){
  if(!o.start||!o.end)return "Setengah hari hanya untuk cuti 1 hari: isi tanggal mulai dan selesai dengan tanggal yang sama.";
  if(o.start!==o.end)return "Tidak bisa dipilih: tanggal yang dipilih lebih dari 1 hari. Setengah hari hanya untuk tanggal mulai dan selesai yang sama.";
  if(!workdays(o.start,o.end))return "Tanggal ini hari Sabtu, Minggu, atau hari libur.";
  return o.half?"Dihitung 0,5 hari.":"Centang bila hanya setengah hari (pagi atau siang).";
}

/* ================= Tracking pengajuan (seperti lacak pengiriman) ================= */
function stamp(ts,isoDate){
  if(ts){var d=new Date(ts);if(d.getHours()||d.getMinutes())return fDate(iso(d))+", "+fTime(ts);return fDate(iso(d))}
  return isoDate?fDate(isoDate):"";
}
function isManagerLeave(l){
  return l.status==="pending_dir"||!!l.dirBy||me.role==="director"||(me.role==="manager"&&state.employees[0]&&state.employees[0].id===l.empId)||((state.managerIds||[]).indexOf(l.empId)>-1);
}
function trackSteps(l){
  var mgr=isManagerLeave(l),steps=[],dirRejected=l.status==="rejected"&&l.dirBy&&l.approver===l.dirBy;
  steps.push({t:"Pengajuan dibuat",state:"done",w:stamp(l.createdAt,l.submitted)+(l.createdBy?" · oleh "+l.createdBy:""),n:l.note?"Alasan: "+l.note:""});
  if(mgr){
    var d={t:"Persetujuan Director"};
    if(l.dirBy){d.state=dirRejected?"rejected":"done";d.t=dirRejected?"Ditolak Director":"Disetujui Director";d.w=stamp(l.dirTs,l.dirAt)+" · "+l.dirBy}
    else if(l.status==="pending_dir"){d.state="current";d.w="Sedang menunggu keputusan Director"}
    else{d.state="skipped";d.w="Tidak melalui Director"}
    steps.push(d);
  }
  var h={t:"Persetujuan Admin HRD"};
  if(l.status==="approved"){h.state="done";h.t="Disetujui Admin HRD";h.w=stamp(l.decidedTs,l.approvedAt)+(l.approver?" · "+l.approver:"")}
  else if(l.status==="rejected"&&!dirRejected){h.state="rejected";h.t="Ditolak Admin HRD";h.w=stamp(l.decidedTs,l.approvedAt)+(l.approver?" · "+l.approver:"")}
  else if(l.status==="pending"){h.state="current";h.w="Sedang menunggu keputusan Admin HRD"}
  else if(dirRejected){h.state="skipped";h.w="Tidak diproses karena ditolak Director"}
  else{h.state="upcoming";h.w=mgr?"Menunggu persetujuan Director terlebih dulu":"Belum diproses"}
  steps.push(h);
  var f={t:"Selesai"};
  if(l.status==="approved"){f.state="done";f.t="Selesai: Disetujui";f.w=TYPES[l.type]&&TYPES[l.type].quota?"Saldo cuti tahunan berkurang "+fNum(l.days)+" hari":"Tidak memotong saldo cuti tahunan"}
  else if(l.status==="rejected"){f.state="rejected";f.t="Selesai: Ditolak";f.w="Saldo tidak berkurang"}
  else{f.state="upcoming";f.w="Status akhir muncul setelah semua persetujuan selesai"}
  steps.push(f);
  return steps;
}
function openTrack(id){
  var l=state.leaves.find(function(x){return x.id===id});if(!l)return;
  var steps=trackSteps(l),total=steps.length,doneN=steps.filter(function(x){return x.state==="done"||x.state==="rejected"}).length;
  var icon={done:"✓",current:"•",rejected:"✕",skipped:"–",upcoming:""};
  dlg.innerHTML='<div class="dlg-head"><div><h2 id="dlg-title">Tracking pengajuan</h2><div class="s">'+esc(empName(l.empId))+' · '+esc(TYPES[l.type].label)+' · '+fRange(l.start,l.end)+' ('+fNum(l.days)+' hari)</div></div><button class="x" data-act="close" aria-label="Tutup">×</button></div>'+
  '<div class="dlg-body"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">'+chipL(l)+'<span class="trk-step">Tahap '+Math.min(doneN+(l.status==="approved"||l.status==="rejected"?0:1),total)+' dari '+total+'</span></div>'+

var GRP_DEFAULT_OPEN={saldo:false,riwayat:true};
function gview(key){if(!ui.gview)ui.gview={};return ui.gview[key]||"divisi"}
function grpOpen(key,g){if(!ui.grp)ui.grp={};if(!ui.grp[key])ui.grp[key]={};var st=ui.grp[key][g];return st===undefined?!!GRP_DEFAULT_OPEN[key]:st}
function grpBody(key,items,deptFn,rowFn,cols,metaFn,searching){
  var groups={},order=[];
  items.forEach(function(it){var g=deptFn(it)||"(Tanpa divisi)";if(!groups[g]){groups[g]=[];order.push(g)}groups[g].push(it)});
  order.sort(function(a,b){return a==="(Tanpa divisi)"?1:b==="(Tanpa divisi)"?-1:a.localeCompare(b,"id")});
  var html="",vis=[];
  order.forEach(function(g){
    var arr=groups[g],open=searching||grpOpen(key,g);
    html+='<tr class="grp-row"><td colspan="'+cols+'"><button class="grp-btn" data-grpk="'+key+'" data-grpd="'+esc(g)+'" aria-expanded="'+open+'"><span class="grp-arrow" aria-hidden="true">'+(open?"▾":"▸")+'</span><b>'+esc(g)+'</b><span class="grp-meta">'+metaFn(arr)+'</span></button></td></tr>';
    if(open){html+=arr.map(function(it,i){return rowFn(it,i)}).join("");vis=vis.concat(arr)}
  });
  return {html:html,vis:vis};
}
function grpControls(key,searching){

}

async function saveLeave(){
  var d=ui.draft,err=document.getElementById("f-err"),btn=document.getElementById("f-save");
  function fail(m){err.textContent=m}
  if(!d.empId)return fail("Pilih karyawan.");
  if(!validIso(d.start)||!validIso(d.end))return fail("Isi tanggal mulai dan tanggal selesai cuti.");

  var n=r1(d.days);if(!(n>0))return fail("Jumlah hari kerja harus lebih dari 0.");
  if(!validIso(d.submitted))return fail("Isi tanggal pengajuan.");
  var e=emp(d.empId),t=TYPES[d.type],b=balanceOf(e,+d.start.slice(0,4),ui.editId);
  if(t.quota&&d.status!=="rejected"&&b.left-n<0&&!(await askConfirm({title:"Saldo tidak cukup",message:"Sisa cuti tahunan "+e.name+" tinggal "+fNum(b.left)+" hari, sedangkan yang diinput "+fNum(n)+" hari. Kelebihan "+fNum(Math.min(n,r1(n-b.left)))+" hari akan dihitung Unpaid Leave (potong gaji).\n\nTetap simpan?",ok:"Tetap simpan"})))return;
  var clash=state.leaves.some(function(l){return l.empId===e.id&&l.id!==ui.editId&&l.status!=="rejected"&&!(l.end<d.start||l.start>d.end)});
  if(clash&&!(await askConfirm({title:"Tanggal bentrok",message:e.name+" sudah punya data cuti di tanggal yang beririsan.\n\nTetap simpan?",ok:"Tetap simpan"})))return;
  btn.disabled=true;btn.textContent="Menyimpan...";
  var wasEdit=!!ui.editId;
  try{
    setBusy(true);
    var p=await call("saveLeave",token,{id:ui.editId||"",empId:d.empId,type:d.type,submitted:d.submitted,start:d.start,end:d.end,days:n,status:d.status,approver:d.approver,approvedAt:d.approvedAt,note:d.note});
    apply(p);
    var after=balanceOf(emp(d.empId)||e,+d.start.slice(0,4)).left;
    ui.draft=newDraft();ui.editId=null;if(wasEdit)ui.tab="riwayat";
    render();toast((wasEdit?"Perubahan disimpan. ":"Data cuti "+e.name+" tersimpan. ")+"Sisa saldo: "+fNum(after)+" hari");
  }catch(x){btn.disabled=false;btn.textContent=wasEdit?"Simpan perubahan":"Simpan data cuti";fail(x.message)}
  finally{setBusy(false)}
}

function parsePaste(text){
  var out=[],skipped=[];
  String(text||"").split(/\r?\n/).forEach(function(line,i){
    if(!line.trim())return;
    var c=(line.indexOf("\t")>-1?line.split("\t"):line.split(/[;,]/)).map(function(x){return x.trim()});
    if(i===0&&/^nama$/i.test(c[0]))return;
    var name=c[0];if(!name)return;
    var quota=c[3]?r1(String(c[3]).replace(",",".")):12;if(!(quota>=0&&quota<=365))quota=12;
    var dup=state.employees.some(function(x){return x.name.toLowerCase()===name.toLowerCase()})||out.some(function(x){return x.name.toLowerCase()===name.toLowerCase()});
    if(dup){skipped.push(name);return}
    out.push({name:name,dept:c[1]||"",title:c[2]||"",quota:quota,empNo:c[4]||""});
  });
  return {rows:out,skipped:skipped};
}
async function doPaste(){
  var p=parsePaste(document.getElementById("p-text").value),err=document.getElementById("p-err"),btn=document.getElementById("p-btn");
  if(!p.rows.length){err.textContent=p.skipped.length?"Semua nama sudah ada di daftar karyawan.":"Belum ada data yang bisa dibaca. Tempel baris dari Excel terlebih dulu.";return}
  btn.disabled=true;btn.textContent="Menyimpan...";
  try{await run("addEmployees",[p.rows],p.rows.length+" karyawan ditambahkan"+(p.skipped.length?", "+p.skipped.length+" nama dilewati karena sudah ada":""));dlg.close()}
  catch(x){err.textContent=x.message;btn.disabled=false;btn.textContent="Simpan semua"}
}

/* Kalender 12 bulan: tanggal merah = libur nasional, oranye = cuti bersama */
function calendarYear(y){
  var H={};state.holidays.forEach(function(h){if(h.date.slice(0,4)===String(y))H[h.date]=h});
  var months=["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];
  var wds=["Min","Sen","Sel","Rab","Kam","Jum","Sab"],today=todayIso(),edit=canWrite();
  var total=0,weekday=0;Object.keys(H).forEach(function(k){total++;var w=parse(k).getDay();if(w&&w!==6)weekday++});
  var html='<div class="cal-head"><div class="cal-legend"><span><i style="background:var(--red)"></i>Libur nasional</span><span><i style="background:var(--amber)"></i>Cuti bersama</span><span><i style="background:none;border:1px solid var(--red)"></i>Minggu (teks merah)</span><span><i style="box-shadow:inset 0 0 0 2px var(--pine)"></i>Hari ini</span></div>'+
    '<div class="sub">'+total+' hari libur di '+y+' · '+weekday+' jatuh di hari kerja</div></div><div class="cal-year">';
  for(var m=0;m<12;m++){
    var first=new Date(+y,m,1),days=new Date(+y,m+1,0).getDate(),start=first.getDay(),cells="",items=[],cnt=0;
    for(var b=0;b<start;b++)cells+='<span></span>';
    for(var d=1;d<=days;d++){
      var iso_=y+"-"+pad(m+1)+"-"+pad(d),w=(start+d-1)%7,h=H[iso_],cls="d";
      if(w===0)cls+=" sun";else if(w===6)cls+=" sat";
      if(h){cls+=/cuti bersama/i.test(h.name)?" cb":" hol";items.push('<li><b>'+d+'</b><span>'+esc(h.name)+'</span></li>');cnt++}
      else if(edit)cls+=" pick";
      if(iso_===today)cls+=" today";
      cells+='<button class="'+cls+'" data-cal-date="'+iso_+'"'+(h?' title="'+esc(fDate(iso_)+" – "+h.name)+'"':(edit?' title="Klik untuk menambah hari libur di tanggal ini"':''))+'>'+d+'</button>';
    }
    html+='<div class="cal-m"><h3>'+months[m]+(cnt?'<span>'+cnt+' libur</span>':'')+'</h3><div class="cal-g">'+wds.map(function(x,i){return '<div class="wd'+(i===0?" sun":"")+'">'+x+'</div>'}).join("")+cells+'</div>'+(items.length?'<ul class="cal-list">'+items.join("")+'</ul>':'')+'</div>';
  }
  return html+'</div>';
}

  if(ev.type==="input"&&t.id==="q"){ui.q=t.value;render();return}

/* Ambil data terbaru otomatis tiap 2 menit saat tidak sedang mengisi formulir */
setInterval(function(){if(me&&!dlg.open&&!ui.myForm&&ui.tab!=="input"&&document.visibilityState==="visible"&&!ui.busy)refresh(true)},120000);

/* ================= Mulai ================= */
(async function start(){
  if(!token){renderLogin();return}
  app.innerHTML='<div class="loading">Memuat data...</div>';
  try{setBusy(true);apply(await call("getData",token));ui.year=+todayIso().slice(0,4);render();if(me.mustChange)openPassword(true)}
  catch(e){forceLogout(e.message==="Sesi berakhir."?"Sesi Anda sudah berakhir. Silakan masuk lagi.":"")}
  finally{setBusy(false)}
})();
})();
</script>
